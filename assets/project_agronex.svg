<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210" />
      <stop offset="50%" stop-color="#081b16" />
      <stop offset="100%" stop-color="#040b08" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)" />
      <stop offset="100%" stop-color="rgba(6, 78, 59, 0.25)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="200" r="220" fill="rgba(16, 185, 129, 0.12)" filter="url(#glow)" />
  <circle cx="900" cy="450" r="260" fill="rgba(0, 242, 254, 0.08)" filter="url(#glow)" />

  <!-- UI Window Container -->
  <rect x="80" y="50" width="1040" height="575" rx="20" fill="rgba(11, 23, 20, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2" />
  
  <!-- Header bar -->
  <rect x="80" y="50" width="1040" height="60" rx="20" fill="rgba(16, 185, 129, 0.1)" />
  <circle cx="120" cy="80" r="7" fill="#ef4444" opacity="0.8" />
  <circle cx="145" cy="80" r="7" fill="#f59e0b" opacity="0.8" />
  <circle cx="170" cy="80" r="7" fill="#10b981" opacity="0.8" />
  <text x="210" y="86" fill="#10b981" font-family="'Courier New', monospace" font-size="16" font-weight="bold">AGRONEX v2.4 // AI CROP DIAGNOSTICS &amp; BILINGUAL TELEMETRY</text>
  <rect x="940" y="68" width="150" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
  <text x="965" y="85" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">ONLINE • LIVE</text>

  <!-- Left Panel: Diagnostics & Detection -->
  <rect x="120" y="140" width="460" height="440" rx="14" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
  
  <!-- Plant Graphic / Scan Area -->
  <rect x="145" y="165" width="410" height="230" rx="10" fill="#03150f" stroke="rgba(16, 185, 129, 0.4)" stroke-dasharray="6,4" />
  
  <!-- Stylized Leaf Stem -->
  <path d="M 350 360 C 350 250, 310 200, 240 210 C 220 260, 270 340, 350 360 Z" fill="#10b981" opacity="0.75" />
  <path d="M 350 360 C 350 230, 420 180, 460 210 C 470 270, 410 330, 350 360 Z" fill="#059669" opacity="0.8" />
  <path d="M 350 380 L 350 210" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  
  <!-- Bounding Box on Infected Area -->
  <rect x="220" y="200" width="110" height="90" rx="6" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <rect x="220" y="180" width="110" height="20" rx="4" fill="#f59e0b" />
  <text x="225" y="194" fill="#000" font-family="sans-serif" font-size="10" font-weight="bold">DISEASE: BLIGHT (97.8%)</text>

  <!-- Scan Reticle -->
  <circle cx="275" cy="245" r="30" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="275" y1="210" x2="275" y2="280" stroke="#10b981" stroke-width="1" />
  <line x1="240" y1="245" x2="310" y2="245" stroke="#10b981" stroke-width="1" />

  <!-- Diagnostics Stats -->
  <text x="145" y="425" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Pathology Analysis: Early Leaf Blight Detected</text>
  <text x="145" y="450" fill="#94a3b8" font-family="sans-serif" font-size="13">Recommended Action: Apply Copper Fungicide 2.5g/L within 48h</text>

  <!-- Confidence Bar -->
  <rect x="145" y="475" width="410" height="8" rx="4" fill="#1e293b" />
  <rect x="145" y="475" width="370" height="8" rx="4" fill="url(#neonGreen)" />
  <text x="145" y="505" fill="#34d399" font-family="monospace" font-size="12">MODEL CONFIDENCE: 97.8% [FastAPI + PyTorch]</text>
  <text x="430" y="505" fill="#94a3b8" font-family="monospace" font-size="12">LATENCY: 142ms</text>

  <!-- Right Panel 1: Bilingual Voice Streaming (Tamil & English) -->
  <rect x="610" y="140" width="480" height="205" rx="14" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
  <text x="635" y="175" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">🎙️ Bilingual Voice Advisory Pipeline</text>
  <rect x="635" y="195" width="90" height="24" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="645" y="211" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Tamil (தமிழ்)</text>
  <rect x="735" y="195" width="90" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="750" y="211" fill="#cbd5e1" font-family="sans-serif" font-size="11">English (EN)</text>

  <!-- Audio Waveform Visualization -->
  <g transform="translate(635, 240)">
    <rect x="0" y="15" width="6" height="30" rx="3" fill="#10b981" />
    <rect x="12" y="5" width="6" height="50" rx="3" fill="#34d399" />
    <rect x="24" y="20" width="6" height="20" rx="3" fill="#10b981" />
    <rect x="36" y="0" width="6" height="60" rx="3" fill="#00f2fe" />
    <rect x="48" y="10" width="6" height="40" rx="3" fill="#34d399" />
    <rect x="60" y="18" width="6" height="24" rx="3" fill="#10b981" />
    <rect x="72" y="8" width="6" height="44" rx="3" fill="#00f2fe" />
    <rect x="84" y="22" width="6" height="16" rx="3" fill="#10b981" />
    <rect x="96" y="2" width="6" height="56" rx="3" fill="#34d399" />
    <rect x="108" y="14" width="6" height="32" rx="3" fill="#10b981" />
    <rect x="120" y="6" width="6" height="48" rx="3" fill="#00f2fe" />
    <rect x="132" y="24" width="6" height="12" rx="3" fill="#10b981" />
    <rect x="144" y="12" width="6" height="36" rx="3" fill="#34d399" />
    <rect x="156" y="0" width="6" height="60" rx="3" fill="#00f2fe" />
    <rect x="168" y="16" width="6" height="28" rx="3" fill="#10b981" />
    <rect x="180" y="22" width="6" height="16" rx="3" fill="#34d399" />
  </g>
  <text x="845" y="275" fill="#34d399" font-family="monospace" font-size="12">STREAMING ACTIVE</text>
  <text x="635" y="325" fill="#94a3b8" font-family="sans-serif" font-size="12">"பயிருக்கு உடனடியாக காப்பர் பூஞ்சைக் கொல்லி தெளிக்கவும்..."</text>

  <!-- Right Panel 2: Architecture & Storage (Supabase + PostgreSQL) -->
  <rect x="610" y="365" width="480" height="215" rx="14" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
  <text x="635" y="400" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">⚡ Full-Stack &amp; Telemetry Dataflow</text>

  <!-- Pipeline Nodes -->
  <g transform="translate(635, 430)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="95" height="50" rx="8" fill="#091e17" stroke="#10b981" stroke-width="1.5" />
    <text x="18" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">React 19</text>
    <text x="12" y="40" fill="#94a3b8" font-family="monospace" font-size="9">Multipart UI</text>

    <!-- Connector -->
    <line x1="95" y1="25" x2="130" y2="25" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Node 2 -->
    <rect x="130" y="0" width="105" height="50" rx="8" fill="#091e17" stroke="#00f2fe" stroke-width="1.5" />
    <text x="145" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">FastAPI</text>
    <text x="140" y="40" fill="#94a3b8" font-family="monospace" font-size="9">Async Router</text>

    <!-- Connector -->
    <line x1="235" y1="25" x2="270" y2="25" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Node 3 -->
    <rect x="270" y="0" width="125" height="50" rx="8" fill="#091e17" stroke="#10b981" stroke-width="1.5" />
    <text x="280" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">PostgreSQL</text>
    <text x="285" y="40" fill="#94a3b8" font-family="monospace" font-size="9">Supabase DB</text>
  </g>
  <text x="635" y="525" fill="#94a3b8" font-family="sans-serif" font-size="12">Sub-second response time • Automated weather alerts • Historical crop logs</text>
  <text x="635" y="550" fill="#34d399" font-family="monospace" font-size="11">DOCKER CONTAINERIZED • FULL ASYNCHRONOUS PIPELINE</text>
</svg>
